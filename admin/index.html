<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; style-src 'self'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Admin: Poll Worker Support</title>
<link rel="stylesheet" href="../style.css">
</head><body>
<main>
<section id="login">
<h1>Admin sign-in</h1>
<p>Sign in to manage the poll worker chat PIN.</p>
<form id="loginForm">
<label for="pw">Admin password</label>
<input id="pw" type="password" required autocomplete="current-password">
<button id="loginBtn" type="submit">Sign in</button>
<p class="err" id="loginMsg" role="alert"></p>
</form>
</section>
<section id="panel" hidden>
<h1>Manage PIN</h1>
<p class="meta" id="state"></p>
<form id="setForm" autocomplete="off">
<label for="pin">New PIN (8 or more characters; letters are not case sensitive)</label>
<input id="pin" type="text" required minlength="8" maxlength="64" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="saveBtn" type="submit">Save PIN</button>
</form>
<hr>
<button id="gen" type="button" class="secondary">Generate a random 8-character PIN</button>
<div id="genOut" hidden>
<div class="pinshow" id="genPin"></div>
<p class="meta">Shown once. Copy it now and share it with poll workers. It has already replaced the previous PIN.</p>
</div>
<p class="ok" id="msg" role="status"></p>
<p class="err" id="err" role="alert"></p>
<hr>
<button id="reset" type="button" class="secondary">Clear PIN lockout</button>
<p class="meta" id="pause"></p>
<hr>
<button id="out" type="button" class="secondary">Sign out</button>
</section>
</main>
<script src="../config.js"></script>
<script src="admin.js"></script>
</body></html>
